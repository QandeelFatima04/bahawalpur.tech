services:
  db:
    image: postgres:16
    container_name: careerbridgeai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: careerbridge
      POSTGRES_USER: careerbridge
      POSTGRES_PASSWORD: careerbridge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerbridge -d careerbridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    container_name: careerbridgeai-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.docker
    environment:
      DATABASE_URL: postgresql+psycopg2://careerbridge:careerbridge@db:5432/careerbridge
    command: >
      sh -c "
      echo '--- alembic upgrade head ---' &&
      (alembic upgrade head || (echo '--- upgrade failed, stamping head ---' && alembic stamp head)) ;
      echo '--- starting uvicorn ---' &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE: ""
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    container_name: careerbridgeai-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

      APP_BASE_URL: ${APP_BASE_URL}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      BOUNCE_EMAIL: ${BOUNCE_EMAIL}
      TEST_EMAIL_SECRET: ${TEST_EMAIL_SECRET}

    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
